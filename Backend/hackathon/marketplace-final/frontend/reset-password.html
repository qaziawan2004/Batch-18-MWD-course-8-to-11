<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password | MarketHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reset">
    <main class="form-page">
        <section class="auth-card">
            <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>MarketHub</span></a></div>
            <h1>Set a new password</h1>
            <p class="subtitle">Your OTP is verified. Choose a strong new password.</p>
            <div id="message" class="message"></div>
            <form id="form" class="form-stack">
                <div class="form-field">
                    <label for="password">New password</label>
                    <input id="password" name="password" type="password" minlength="6" required placeholder="Minimum 6 characters">
                </div>
                <div class="form-field">
                    <label for="confirmPassword">Confirm password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required placeholder="Repeat new password">
                </div>
                <button class="btn btn-primary" type="submit">Reset password</button>
            </form>
        </section>
    </main>
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
