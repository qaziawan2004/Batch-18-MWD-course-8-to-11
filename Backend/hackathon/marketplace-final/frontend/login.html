<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MarketHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
    <main class="form-page">
        <section class="auth-card">
            <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>MarketHub</span></a></div>
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to manage your marketplace account.</p>
            <div id="message" class="message"></div>
            <form id="form" class="form-stack">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required placeholder="you@example.com">
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required placeholder="Your password">
                </div>
                <button class="btn btn-primary" type="submit">Login</button>
            </form>
            <div class="auth-links">
                <a class="text-link" href="forgot-password.html">Forgot password?</a>
                <a class="text-link" href="signup.html">Create account</a>
            </div>
        </section>
    </main>
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
