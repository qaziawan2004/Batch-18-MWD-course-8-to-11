<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | MarketHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
    <main class="form-page">
        <section class="auth-card">
            <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>MarketHub</span></a></div>
            <h1>Create your account</h1>
            <p class="subtitle">Sign up and verify your email to start selling.</p>
            <div id="message" class="message"></div>
            <form id="form" class="form-stack">
                <div class="form-field">
                    <label for="name">Full name</label>
                    <input id="name" name="name" required minlength="2" placeholder="Your full name">
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required placeholder="you@example.com">
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" required minlength="6" placeholder="Minimum 6 characters">
                    </div>
                    <div class="form-field">
                        <label for="confirmPassword">Confirm</label>
                        <input id="confirmPassword" name="confirmPassword" type="password" required minlength="6" placeholder="Repeat password">
                    </div>
                </div>
                <button class="btn btn-primary" type="submit">Create account</button>
            </form>
            <div class="auth-links">
                <span class="muted">Already registered?</span>
                <a class="text-link" href="login.html">Login</a>
            </div>
        </section>
    </main>
    <script type="module" src="js/theme.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
