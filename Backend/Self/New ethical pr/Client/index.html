<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="body">
        <h1>Create Account</h1>
        <div class="form">
            <input type="text" name="fullName" id="fullName" placeholder="Enter your FullName!">
            <input type="email" name="email" id="email" placeholder="Please Enter your Email here!" >
            <input type="password" name="password" id="password" placeholder="Please Enter your password here!">
            <input type="password" name="con-password" id="con-password" placeholder="Confirm your password!">
            <div class="button">
                <button onclick="createAccount()">SignUp</button>
                <a href="">Already have an Account!</a>
            </div>
        </div>

        </div>
    </div>
</body>
<script src="./signup.js"></script>
</html>
