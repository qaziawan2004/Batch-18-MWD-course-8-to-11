<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <aside>
            adjask
        </aside>

        <div >
            <div class="headercontent">
            <header>

                <div class="hp-1">

                    <input type="search" placeholder="Search anything...">

                </div>


                <div class="hp-2">

                    <img class="b-icon" src="assets/bellicon.png" alt="bellicon">


                    <div class="usersec">

                        <div class="usersec1">

                            <img class="p-icon" src="assets/picon.png" alt="profile">

                        </div>


                        <div class="usersec2">

                            <b id="username">
                                John Doe
                            </b>

                            <p id="userstatus">
                                Admin
                            </p>

                        </div>

                    </div>

                </div>

            </header>

            </div>
   <div class="content1">


            <div id="Dashboard">

                <h1>
                    Dashboard
                </h1>


                <div>

                    <section>

                        <div class="sec1">

                            <input type="text" name="item" id="item" placeholder="Item">

                            <input type="text" name="desc" id="desc" placeholder="Description">

                            <input type="date" name="date" id="date">

                            <select name="dropdown" id="dd">

                                <option value="low">
                                    low
                                </option>

                                <option value="medium">
                                    medium
                                </option>

                                <option value="high">
                                    high
                                </option>

                            </select>

                        </div>

                    </section>


                    <section class="sec2">

                        <div id="todos">

                        </div>

                    </section>

                </div>

            </div>

        </div>
        </div>


     

    </div>


    <script src="./script.js"></script>

</body>

</html>
