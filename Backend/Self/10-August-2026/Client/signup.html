<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body onload="authCheck()">
    <div class="cont">
        <h1 class="cont-h1">Create Your Account</h1>
    <div class="signup-card">
        <h2 class="signup-card-h2">Signup Form</h2>
        <input type="text" name="fullName" placeholder="Enter your fullName here!" id="fullName">
        <input type="email" name="email" placeholder="Enter your email here!" id="email">
        <input type="password" name="password" placeholder="Enter your password here!" id="password">
        <input type="password" name="confirm-password" placeholder="Retype your password" id="confirm-password">
        <div class="button">
            <a href="./login.html">Already have an Account??</a>
            <button type="button" onclick="signUp()">Signup</button>
        </div>
    </div>
    </div>
    <script type="module" src="./script.js"></script>
</body>

</html>
